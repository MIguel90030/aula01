<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">

<script src="tema.js"></script>
    <meta charset="UTF-8">
    <title>Login - Sistema RH</title>
  
</head>
<body>
    <div class="login-card">
        <h2>RH System</h2>
        <input type="text" id="user" placeholder="Usuário (admin)">
        <input type="password" id="pass" placeholder="Senha (123)">
        <button onclick="logar()">Entrar</button>
    </div>

    <script>
        function logar() {
            const u = document.getElementById('user').value;
            const s = document.getElementById('pass').value;
            if(u === 'admin' && s === '123') {
                localStorage.setItem('logado', 'true');
                window.location.href = 'index.html';
            } else {
                alert('Acesso negado!');
            }
        }
        document.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        logar();
    }
});
// Esta função é o que o botão 'onclick' procura


// Isso aqui faz a página carregar no modo certo assim que abre
document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem('tema') === 'dark') {
        document.body.classList.add('dark-mode');
    }
});
    </script>
</body>
</html>

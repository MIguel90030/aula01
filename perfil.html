<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">

<script src="tema.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Funcionário</title>
   
</head>
<body>

<div class="profile-card" id="cardPerfil">
    </div>

<script>
  window.onload = () => {
    // 1. Verificação de Segurança
    if (localStorage.getItem('logado') !== 'true') {
        window.location.href = 'login.html';
        return; 
    }

    // 2. Recuperação dos Dados
    const usuario = JSON.parse(localStorage.getItem('visualizarUsuario'));

    if (!usuario) {
        document.body.innerHTML = "<h1>Funcionário não encontrado!</h1><a href='index.html'>Voltar</a>";
        return;
    }

    // Mantendo a lógica do Dark Mode
    if (localStorage.getItem('tema') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    const corStatus = usuario.status === 'Férias' ? '#fdcb6e' : (usuario.status === 'Treinamento' ? '#0984e3' : '#00b894');

    document.getElementById('cardPerfil').innerHTML = `
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${usuario.nome}" class="avatar-grande">
        
        <div class="badge-status" style="background: ${corStatus}22; color: ${corStatus}">
            ● ${usuario.status || 'Ativo'}
        </div>

        <h2 style="margin: 0 0 5px 0;">${usuario.nome}</h2>
        <p style="color: var(--primary); font-weight: bold; margin: 0 0 5px 0; text-transform: uppercase; font-size: 14px;">
            ${usuario.cargo || 'Cargo não informado'}
        </p>
        <p style="color: #636e72; margin-bottom: 30px; font-size: 13px;">ID: #${usuario.id.toString().slice(-6)}</p>

        <div class="info-group">
            <label>E-mail Corporativo</label>
            <span>${usuario.email}</span>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="info-group" style="flex: 1;">
                <label>CPF</label>
                <span>${usuario.cpf || '---'}</span>
            </div>
            <div class="info-group" style="flex: 1;">
                <label>Telefone</label>
                <span>${usuario.telefone || '---'}</span>
            </div>
        </div>

        <div class="info-group">
            <label>Setor / Departamento</label>
            <span>${usuario.setor}</span>
        </div>

        <div class="info-group">
            <label>Data de Admissão</label>
            <span>${usuario.admissao ? new Date(usuario.admissao).toLocaleDateString('pt-BR') : 'Não informada'}</span>
        </div>

        <a href="index.html" class="btn-voltar">← Voltar para a Lista</a>
    `;
};
// Esta função é o que o botão 'onclick' procura

// Isso aqui faz a página carregar no modo certo assim que abre
document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem('tema') === 'dark') {
        document.body.classList.add('dark-mode');
    }
});
</script>

</body>
</html>
